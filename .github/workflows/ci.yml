# Runs on every pull request. A red X means something below failed — click it to see why.
name: Checks
on:
  push:
    branches: [main]
  pull_request:

jobs:
  web-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      # Real-database tests against a throwaway local MongoDB (issue #33).
      # Kept out of `npm run check` so production deploys don't download MongoDB.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-7.0.14
      - run: npm run test:integration

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned so a new Flutter release can't break CI overnight. 3.50 deprecates
          # package:flutter/material.dart; bump this after migrating to material_ui.
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
