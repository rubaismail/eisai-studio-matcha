# Installed on the server as /etc/nginx/conf.d/eisai-gzip.conf (http context).
# Ubuntu's nginx.conf turns gzip on but only compresses HTML; this adds the
# website's JS/CSS and the API's JSON. Applies to every site on the server.
gzip_types text/css application/javascript application/json image/svg+xml text/plain; gzip_vary on;
