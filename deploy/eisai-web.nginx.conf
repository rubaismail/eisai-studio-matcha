# Website: https://eisaistudio.com (www redirects to it).
# Installed on the server as /etc/nginx/sites-available/eisai-web (see docs/deployment.md).
# HTTP only as committed; `sudo certbot --nginx -d eisaistudio.com -d www.eisaistudio.com`
# adds HTTPS and the http -> https redirect afterwards.
# After certbot, change its `listen 443 ssl;` to `listen 443 ssl http2;` (see docs/production-handoff.md).
# Compression for JS/CSS comes from deploy/eisai-gzip.nginx.conf.
#
# The site is served from the live release, so `sudo eisai-deploy` updates the
# website and API together and rolls both back together. The site calls /api/ on
# its own origin (the web app's default), which is proxied to the same API that
# api.eisaistudio.com serves, so no CORS is involved.
#
# The `eisai` log_format is defined in the eisai-api site file; don't redefine it here.

# www -> apex. The API only accepts browser requests from exactly WEB_ORIGIN.
server {
    listen 80;
    server_name www.eisaistudio.com;
    server_tokens off;
    return 301 https://eisaistudio.com$request_uri;
}

server {
    listen 80;
    server_name eisaistudio.com;
    server_tokens off;
    # Logs omit query strings: verify/reset links carry tokens in the URL.
    access_log /var/log/nginx/eisai-access.log eisai;
    error_log /var/log/nginx/eisai-error.log warn;
    client_max_body_size 6m;
    root /srv/eisai/current/apps/web/dist;
    index index.html;
    # Keeps token-bearing URLs out of Referer headers sent to other sites.
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Vite's hashed bundles never change, so browsers can cache them for a long time.
    location /assets/ {
        add_header Referrer-Policy no-referrer always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # React Router pages (/menu, /verify-email, /reset-password, ...) all load index.html.
    # no-cache makes browsers pick up a new deploy right away.
    location / {
        add_header Referrer-Policy no-referrer always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
