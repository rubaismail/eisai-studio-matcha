name: eisai_mobile
description: "Eisai Studio mobile app (Team 22)."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  file_picker: ^13.3.2
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  http: 1.5.0
  http_parser: ^4.1.2
  url_launcher: ^6.3.3
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/videos/

  fonts:
    - family: Questrial
      fonts:
        - asset: assets/fonts/Questrial-Regular.ttf

    - family: Unbounded
      fonts:
        - asset: assets/fonts/Unbounded-Medium.ttf
          weight: 500

    - family: Anonymous Pro
      fonts:
        - asset: assets/fonts/AnonymousPro-Regular.ttf
        - asset: assets/fonts/AnonymousPro-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#8B91C7"
  adaptive_icon_foreground: "assets/images/app_icon.png"

